services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: store_intelligence
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5

  cv-service:
    build: ./cv-service
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./cv-service:/app
      - ./videos:/app/videos
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  api-service:
    build: ./api-service
    ports:
      - "3000:3000"
    env_file: .env
    volumes:
      - ./api-service:/app
      - /app/node_modules
    depends_on:
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    build: ./dashboard
    ports:
      - "5173:5173"
    env_file: .env
    volumes:
      - ./dashboard:/app
      - /app/node_modules
    depends_on:
      - api-service
    restart: unless-stopped

volumes:
  mongo_data:
